name: Release

# Tag push → GitHub Release (darwin amd64/arm64 archives) + Homebrew cask update.
# GitHub-only on purpose, same guard as ci.yml / pages.yml for the self-hosted mirror.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.0.1. Leave empty to use the triggering ref."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For workflow_dispatch re-releases of an older tag.
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with Contents: write on francistse/homebrew-tap.
          # When unset, GoReleaser still publishes GitHub Release assets and
          # skips the tap push (see skip_upload in .goreleaser.yml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
