version: 2

project_name: deployboard

before:
  hooks:
    - go test ./cmd/... ./internal/... ./web/...

builds:
  - main: ./cmd/deployboard
    binary: deployboard
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# brews: DISABLED for phase 1 — Deployboard ships install.sh only.
#
# This block used to publish a formula into RoboZephyr/homebrew-tap, which is UPSTREAM's tap:
# goreleaser would have written a Deployboard formula into somebody else's project. A release
# must not do that, so the block is removed rather than left commented-out (YAML has no block
# comments, and a "comment above an active block" is still an active block).
#
# Phase 2 restores this pointed at our own tap, with the homepage/description and any binary
# rename decided there. See the Homebrew card on the kanban board.
