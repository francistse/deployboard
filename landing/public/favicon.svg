<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deployboard">
  <!-- dark tile, matching the dashboard's own background -->
  <rect width="64" height="64" rx="13" fill="#05070D"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="12.5" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- a board of jobs: one running, one errored, one retired -->
  <rect x="14" y="15" width="14" height="6" rx="3" fill="#34D399"/>
  <rect x="33" y="15" width="17" height="6" rx="3" fill="#22D3EE" fill-opacity="0.55"/>
  <rect x="14" y="27" width="26" height="6" rx="3" fill="#F87171"/>
  <rect x="45" y="27" width="5" height="6" rx="2.5" fill="#FBBF24" fill-opacity="0.7"/>
  <rect x="14" y="39" width="10" height="6" rx="3" fill="#8B94A7"/>
  <rect x="29" y="39" width="21" height="6" rx="3" fill="#22D3EE" fill-opacity="0.3"/>
</svg>
